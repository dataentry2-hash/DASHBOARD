
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATABASE Dashboard</title>

<style>
:root {
  --bg: #f4f6fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #68738a;
  --line: #e5e9f2;
  --primary: #4f46e5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px Arial, sans-serif;
}
.hidden { display: none !important; }
button, input { font: inherit; }
button {
  background: var(--primary);
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
  cursor: pointer;
  font-weight: bold;
}
input {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 9px;
  outline: none;
}
input:focus { border-color: var(--primary); }
.login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg,#e0e7ff,#f8fafc,#ede9fe);
}
.login-card {
  width: min(400px,100%);
  padding: 30px;
  background: white;
  border: 1px solid #fff;
  border-radius: 20px;
  box-shadow: 0 20px 60px #202b5015;
}
.logo {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  background: var(--primary);
  color: white;
  border-radius: 14px;
  font-size: 25px;
}
.login h1 { margin-bottom: 5px; }
.muted { color: var(--muted); }
label {
  display: block;
  font-weight: bold;
  margin: 17px 0 7px;
}
.wide { width: 100%; margin-top: 20px; }
.error { color: #dc2626; min-height: 22px; margin-top: 12px; }

header {
  background: white;
  border-bottom: 1px solid var(--line);
  padding: 15px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 5;
}
header h2 { margin: 0; font-size: 19px; }
header p { margin: 4px 0 0; color: var(--muted); }
.actions { display: flex; gap: 8px; }
.secondary { background: #eef2ff; color: var(--primary); }
.logout { background: #fff1f2; color: #be123c; }

main { max-width: 1500px; margin: auto; padding: 22px; }
.welcome { margin-bottom: 18px; }
.welcome h2 { margin: 0 0 5px; }
.cards {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.card, .panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 8px 25px #17203308;
  min-width: 0;
}
.card-title { color: var(--muted); font-weight: bold; }
.card-value { font-size: 27px; font-weight: 800; margin-top: 10px; }
.tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
.tab {
  white-space: nowrap;
  background: white;
  color: var(--muted);
  border: 1px solid var(--line);
}
.tab.active { background: var(--primary); color: white; }
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}
.panel h3 { margin: 0; }
.search { max-width: 350px; }
.table-wrap {
  overflow: auto;
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  min-width: 650px;
  background: white;
}
th, td {
  padding: 12px;
  text-align: left;
  white-space: nowrap;
  border-bottom: 1px solid var(--line);
}
th { background: #f8f9fc; color: #58647b; }
tr:last-child td { border-bottom: 0; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.footer { text-align: right; margin-top: 12px; color: var(--muted); font-size: 12px; }

@media(max-width:900px) {
  .cards { grid-template-columns: repeat(2,minmax(0,1fr)); }
  main { padding: 14px; }
  header { padding: 13px; }
}
@media(max-width:500px) {
  .cards { gap: 8px; }
  .card { padding: 12px; }
  .card-value { font-size: 20px; }
  .card-title { font-size: 12px; }
  .login-card { padding: 23px; }
  header h2 { font-size: 15px; }
  .actions button { padding: 9px; }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<section id="loginPage" class="login">
  <div class="login-card">
    <div class="logo">▦</div>
    <h1>Business Dashboard</h1>
    <p class="muted">Inventory · Delivery · Khata Balance</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" required autocomplete="username"
             placeholder="Enter username">

      <label for="password">Password</label>
      <input id="password" type="password" required
             autocomplete="current-password"
             placeholder="Enter password">

      <button class="wide" id="loginBtn" type="submit">
        Login to Dashboard
      </button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
</section>

<!-- MAIN DASHBOARD -->
<section id="appPage" class="hidden">
  <header>
    <div>
      <h2>▦ DATABASE Dashboard</h2>
      <p>Google Sheets Live Data</p>
    </div>
    <div class="actions">
      <button class="secondary" onclick="loadDashboard()">↻ Refresh</button>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>

  <main>
    <div class="welcome">
      <h2>Business Overview</h2>
      <div class="muted" id="updatedAt">Loading...</div>
      <div class="muted" id="userLabel"></div>
    </div>

    <div class="cards" id="cards"></div>

    <nav class="tabs">
      <button class="tab active" data-tab="inventory">Inventory</button>
      <button class="tab" data-tab="delivery">Delivery</button>
      <button class="tab" data-tab="khata">Khata Balance</button>
    </nav>

    <section id="inventoryPanel" class="panel">
      <div class="panel-head">
        <h3>Inventory / Sales Stock (A:E)</h3>
        <input class="search" id="inventorySearch"
               placeholder="Search SKU or category...">
      </div>
      <div id="inventoryTable"></div>
      <div class="footer" id="inventoryCount"></div>
    </section>

    <section id="deliveryPanel" class="panel hidden">
      <div class="panel-head">
        <h3>Delivery Records (G:O)</h3>
        <input class="search" id="deliverySearch"
               placeholder="Search date, khata...">
      </div>
      <div id="deliveryTable"></div>
    </section>

    <section id="khataPanel" class="panel hidden">
      <div class="panel-head">
        <h3>Khata Balance (R:S)</h3>
        <input class="search" id="khataSearch"
               placeholder="Search khata name...">
      </div>
      <div id="khataTable"></div>
    </section>

    <p class="footer">Read-only dashboard · Sheet4 is not modified</p>
  </main>
</section>

<script>
// Apps Script Web App URL.
// Deploy karne ke baad yahan apna /exec URL paste kar sakte hain.
// Is embedded Apps Script version mein calls google.script.run se hoti hain.
const API_URL = 'https://script.google.com/macros/s/AKfycbyir3sCI10fyUs9u7h4tj551zZcTQV6xNbxZgP7L8HedlPxh2i6CnuDiLnTxPgSad1qmA/exec';

let token = '';
let dashboardData = null;
let activeTab = 'inventory';

const $ = id => document.getElementById(id);

// API calls to Code.gs
// Important: This page must be served through Apps Script doGet().
function apiCall(action, payload) {
  return new Promise((resolve, reject) => {
    if (typeof google === 'undefined' ||
        !google.script || !google.script.run) {
      reject(new Error(
        'Website Apps Script Web App URL se open karein.'
      ));
      return;
    }

    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(err =>
        reject(new Error(err.message || 'API connection error'))
      )
      .api(action, payload || {});
  });
}

// Login
$('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  $('loginBtn').disabled = true;
  $('loginBtn').textContent = 'Please wait...';
  $('loginError').textContent = '';

  try {
    const result = await apiCall('login', {
      username: $('username').value,
      password: $('password').value
    });

    if (!result.ok) throw new Error(result.message);

    token = result.token;
    $('loginPage').classList.add('hidden');
    $('appPage').classList.remove('hidden');
    $('userLabel').textContent =
      'Logged in: ' + result.user.username +
      ' | Role: ' + result.user.role;

    renderDashboard(result.data);

  } catch (err) {
    $('loginError').textContent = err.message;
  } finally {
    $('loginBtn').disabled = false;
    $('loginBtn').textContent = 'Login to Dashboard';
  }
});

// Refresh dashboard
async function loadDashboard() {
  if (!token) return;

  try {
    const result = await apiCall('dashboard', { token: token });
    if (!result.ok) throw new Error(result.message);
    renderDashboard(result.data);
  } catch (err) {
    alert(err.message);
    if (/session|login/i.test(err.message)) logout();
  }
}

// Logout
async function logout() {
  const oldToken = token;
  token = '';

  if (oldToken) {
    try {
      await apiCall('logout', { token: oldToken });
    } catch (e) {
      // Local logout still proceeds.
    }
  }

  dashboardData = null;
  $('appPage').classList.add('hidden');
  $('loginPage').classList.remove('hidden');
  $('password').value = '';
  $('loginError').textContent = '';
}

// Number formatting
function fmt(value) {
  return Number(value || 0).toLocaleString('en-IN', {
    maximumFractionDigits: 2
  });
}

// Prevent sheet text from being treated as HTML
function esc(value) {
  return String(value == null ? '' : value).replace(
    /[&<>"']/g,
    ch => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[ch]
  );
}

// KPI cards
function renderDashboard(data) {
  dashboardData = data;
  $('updatedAt').textContent =
    'Last updated: ' + new Date(data.updatedAt).toLocaleString();

  const k = data.kpis;
  const items = [
    ['Total Inventory', k.totalInventory],
    ['Available Stock', k.available],
    ['Blocked Stock', k.blocked],
    ['Bad Count', k.bad],
    ['SKU Count', k.skuCount],
    ['Delivery Records', k.deliveryRows],
    ['Khata Accounts', k.khataCount],
    ['Total Khata Balance', k.khataBalance]
  ];

  $('cards').innerHTML = items.map(item => `
    <div class="card">
      <div class="card-title">${esc(item[0])}</div>
      <div class="card-value">${fmt(item[1])}</div>
    </div>
  `).join('');

  renderInventory();
  renderDelivery();
  renderKhata();
  showTab(activeTab);
}

// Reusable table builder
function makeTable(headers, rows, emptyMessage) {
  if (!rows.length) {
    return '<div class="empty">' + esc(emptyMessage) + '</div>';
  }

  return `
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${headers.map(h => '<th>' + esc(h) + '</th>').join('')}
        </tr></thead>
        <tbody>
          ${rows.map(row => '<tr>' +
            row.map(v => '<td>' + esc(v) + '</td>').join('') +
            '</tr>').join('')}
        </tbody>
      </table>
    </div>`;
}

// Inventory
function renderInventory() {
  if (!dashboardData) return;

  const q = $('inventorySearch').value.toLowerCase();
  const rows = dashboardData.inventory.filter(r =>
    (String(r.sku) + ' ' + String(r.category))
      .toLowerCase().includes(q)
  );

  $('inventoryTable').innerHTML = makeTable(
    ['SKU', 'Category', 'Inventory', 'Blocked', 'Bad Count', 'Available'],
    rows.map(r => [
      r.sku, r.category, fmt(r.inventory),
      fmt(r.blocked), fmt(r.bad), fmt(r.available)
    ]),
    'No inventory records found.'
  );

  $('inventoryCount').textContent =
    'Showing ' + rows.length + ' of ' +
    dashboardData.inventoryTotal + ' matching rows.';
}

// Delivery
function renderDelivery() {
  if (!dashboardData) return;

  const q = $('deliverySearch').value.toLowerCase();

  const rows = dashboardData.delivery.filter(r =>
    (String(r.date) + ' ' + String(r.khata) + ' ' +
     String(r.detail) + ' ' + String(r.other))
      .toLowerCase().includes(q)
  );

  $('deliveryTable').innerHTML = makeTable(
    ['Date', 'Khata', 'Detail', 'Main', 'Main-2',
     'RFS', 'Second', 'Total', 'Other'],
    rows.map(r => [
      r.date, r.khata, r.detail, r.main, r.main2,
      r.rfs, r.second, r.total, r.other
    ]),
    'No delivery records found.'
  );
}

// Khata
function renderKhata() {
  if (!dashboardData) return;

  const q = $('khataSearch').value.toLowerCase();

  const rows = dashboardData.khata.filter(r =>
    String(r.name).toLowerCase().includes(q)
  );

  $('khataTable').innerHTML = makeTable(
    ['Khata Name', 'Balance'],
    rows.map(r => [r.name, fmt(r.balance)]),
    'No khata accounts found.'
  );
}

// Tabs
function showTab(tab) {
  activeTab = tab;

  ['inventory', 'delivery', 'khata'].forEach(name => {
    $(name + 'Panel').classList.toggle('hidden', name !== tab);
  });

  document.querySelectorAll('.tab').forEach(button => {
    button.classList.toggle('active', button.dataset.tab === tab);
  });
}

document.querySelectorAll('.tab').forEach(button => {
  button.addEventListener('click', () => showTab(button.dataset.tab));
});

$('inventorySearch').addEventListener('input', renderInventory);
$('deliverySearch').addEventListener('input', renderDelivery);
$('khataSearch').addEventListener('input', renderKhata);
</script>
</body>
</html>
